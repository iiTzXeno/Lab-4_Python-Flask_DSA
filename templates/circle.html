<!DOCTYPE html>
<html>
<head>
    <title>Area of a Circle</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 40px;
        }
        h1 {
            color: #ffffff;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        nav li a {
            display: inline-block;
            background-color: #1e1e1e;
            color: #bb86fc;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        nav li a:hover {
            background-color: #bb86fc;
            color: #121212;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(187, 134, 252, 0.3);
        }
        form {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
            max-width: 300px;
            margin-top: 20px;
        }
        input[type="text"] {
            background-color: #121212;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 5px;
            width: 90%;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        input[type="submit"] {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        input[type="submit"]:hover {
            background-color: #a368fc;
            transform: translateY(-2px);
        }
        a {
            color: #bb86fc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Area of a Circle</h1>

    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/works">Works</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>
    <hr>

    <form action="/works/area/circle" method="post">
        <label for="radius">Enter a radius (cm):</label><br>
        <input type="text" id="radius" name="radius"><br>
        <input type="submit" value="Compute">
    </form>

    {% if error %}
    <p>ValueError: {{ error }}</p>
    {% endif %}

    {% if result %}
    <p>Area of the circle: {{ result }}</p>
    {% endif %}

    <br>
    <a href="/works">Back to Works</a>
</body>
</html>
