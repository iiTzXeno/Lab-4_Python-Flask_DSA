<!DOCTYPE html>
<html>
<head>
    <title>Convert to Uppercase</title>
</head>
<body>
    <h1>Convert String to Uppercase</h1>

        <nav>
        <ul style="list-style-type: none; padding: 0;">
            <li style="display: inline; margin-right: 15px;"><a href="/">Home</a></li>
            <li style="display: inline; margin-right: 15px;"><a href="/profile">Profile</a></li>
            <li style="display: inline; margin-right: 15px;"><a href="/works">Works</a></li>
            <li style="display: inline;"><a href="/contact">Contact</a></li>
        </ul>
    </nav>
    <hr>

    <form action="/works/touppercase" method="post">
        <label for="inputString">Enter a string:</label>
        <input type="text" id="inputString" name="inputString">
        <input type="submit" value="Convert">
    </form>

    {% if error %}
    <p>ValueError: {{ error }}</p>
    {% endif %}

    {% if result %}
    <p>Converted string: {{ result }}</p>
    {% endif %}
</body>
</html>
