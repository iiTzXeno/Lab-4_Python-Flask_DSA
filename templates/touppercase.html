<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Uppercase Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; padding: 40px; }
        header { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 50px auto; }
        .logo { font-size: 24px; font-weight: bold; color: #ffffff; text-decoration: none; }
        .logo span { color: #bb86fc; }
        nav ul { list-style-type: none; display: flex; gap: 25px; }
        nav li a { color: #e0e0e0; text-decoration: none; transition: color 0.3s ease; }
        nav li a:hover, nav li a.active { color: #bb86fc; }
        .talk-btn { background-color: #bb86fc; color: #121212; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; }
        
        .tool-container { max-width: 700px; margin: 0 auto; background-color: #1e1e1e; border: 1px solid #333; border-radius: 16px; padding: 32px; }
        .tool-header h1 { font-size: 28px; color: #ffffff; margin-bottom: 8px; }
        .tool-header p { color: #aaa; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; color: #ccc; font-size: 14px; margin-bottom: 8px; }
        input[type="text"] { width: 100%; background-color: #121212; color: #fff; border: 1px solid #444; padding: 12px 16px; border-radius: 10px; font-size: 15px; outline: none; }
        input[type="text"]:focus { border-color: #bb86fc; }
        .btn-submit { background-color: #bb86fc; color: #121212; border: none; padding: 12px 24px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background-color: #a368fc; }
        .result-box { margin-top: 24px; background-color: #121212; border: 1px solid #333; border-radius: 10px; padding: 16px; text-align: left; }
        .result-box h3 { color: #bb86fc; font-size: 14px; margin-bottom: 6px; }
        .result-box p { color: #fff; font-size: 16px; }
        .error-box { margin-top: 24px; background-color: #121212; border: 1px solid #ff5555; border-radius: 10px; padding: 16px; text-align: left; }
        .error-box h3 { color: #ff5555; font-size: 14px; margin-bottom: 6px; }
        .error-box p { color: #ff5555; font-size: 16px; }
        .back-link { display: inline-block; margin-top: 20px; color: #bb86fc; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">Tristan<span>.</span></a>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/profile">About</a></li>
                <li><a href="/works" class="active">Portfolio</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
        <a href="/contact" class="talk-btn">Let's Talk</a>
    </header>

    <main class="tool-container">
        <div class="tool-header">
            <h1>String Uppercase Tool</h1>
            <p>Instantly convert your custom text strings into full uppercase format.</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="text">Enter Text:</label>
                <!-- Matches inputString in app.py -->
                <input type="text" id="text" name="inputString" placeholder="Type something here..." required>
            </div>
            <button type="submit" class="btn-submit">Convert to Uppercase</button>
        </form>

        {% if result %}
        <div class="result-box">
            <h3>Converted Result:</h3>
            <p>{{ result }}</p>
        </div>
        {% endif %}

        {% if error %}
        <div class="error-box">
            <h3>Error:</h3>
            <p>{{ error }}</p>
        </div>
        {% endif %}

        <a href="/works" class="back-link">&larr; Back to Works</a>
    </main>
</body>
</html>
