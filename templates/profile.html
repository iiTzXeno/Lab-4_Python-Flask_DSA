<!DOCTYPE html>
<html>
<head>
    <title>Profile Page</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 40px;
        }
        h1, h2, h3 {
            color: #ffffff;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        nav li a {
            display: inline-block;
            background-color: #1e1e1e;
            color: #bb86fc;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        nav li a:hover {
            background-color: #bb86fc;
            color: #121212;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(187, 134, 252, 0.3);
        }
        .profile-card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #333;
            max-width: 450px;
            margin-top: 20px;
        }
        .profile-card img {
            border-radius: 10px;
            border: 2px solid #444;
        }
        blockquote {
            background: #121212;
            border-left: 4px solid #bb86fc;
            margin: 10px 0;
            padding: 10px 15px;
            font-style: italic;
            color: #d1d1d1;
        }
        a {
            color: #bb86fc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>My Profile</h1>

    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/works">Works</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>
    <hr>

    <!-- Profile Information Section -->
    <div class="profile-card">
        <img src="{{ url_for('static', filename='profile.jpg') }}" alt="Profile Picture" width="150">
        
        <h2>Personal Information</h2>
        <p><strong>Name:</strong> Gaboy, Tristan Kyle T.</p>
        <p><strong>Course and Section:</strong> BSCpE 2-1</p>
        <p><strong>Subject:</strong> Data Structures and Algorithms</p>
        
        <h3>Favorite Motto / Saying</h3>
        <blockquote>
            "Carpe Diem!!"
        </blockquote>
    </div>

    <br>
    <a href="/">Back to Home</a>
</body>
</html>
