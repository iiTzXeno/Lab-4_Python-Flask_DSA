<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; padding: 40px; text-align: center; }
        
        /* Portfolio Header / Nav */
        header { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 50px auto; }
        .logo { font-size: 24px; font-weight: bold; color: #ffffff; text-decoration: none; }
        .logo span { color: #bb86fc; }
        nav ul { list-style-type: none; display: flex; gap: 25px; }
        nav li a { color: #e0e0e0; text-decoration: none; transition: color 0.3s ease; }
        nav li a:hover, nav li a.active { color: #bb86fc; }
        .talk-btn { background-color: #bb86fc; color: #121212; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; }

        h1, h2 { color: #ffffff; }
        .contact-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #333;
            max-width: 450px;
            margin: 20px auto;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .contact-card p {
            margin-bottom: 12px;
            font-size: 15px;
            color: #bbb;
        }
        .contact-card strong {
            color: #fff;
        }
        a {
            color: #bb86fc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn-action {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 10px 18px;
            border-radius: 18px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-action:hover {
            background-color: #a368fc;
            transform: translateY(-2px);
        }

        .back-container {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">Tristan<span>.</span></a>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/profile">About</a></li>
                <li><a href="/works">Portfolio</a></li>
                <li><a href="/contact" class="active">Contact</a></li>
            </ul>
        </nav>
        <a href="/contact" class="talk-btn">Let's Talk</a>
    </header>

    <main>
        <h1>Contact</h1>

        <div class="contact-card" style="margin-top: 30px;">
            <h2>Contact Information</h2>
            <p style="margin-top: 10px;">Feel free to reach out to us with any questions or inquiries!</p>
            <p><strong>Email:</strong> <span id="email-text">gaboytristan18@gmail.com</span></p>
            <p><strong>GitHub:</strong> <a href="https://github.com/iiTzXeno" target="_blank">https://github.com/iiTzXeno</a></p>
            <p><strong>Facebook:</strong> <a href="https://facebook.com/kyle.gaboy/" target="_blank">https://facebook.com/kyle.gaboy/</a></p>

            <div class="btn-group">
                <button type="button" class="btn-action" onclick="copyEmail()">Copy Email</button>
            </div>
        </div>

        <div class="back-container">
            <a href="/" style="color: #bb86fc; font-size: 14px;">&larr; Back to Home</a>
        </div>
    </main>

    <script>
        function copyEmail() {
            const email = "gaboytristan18@gmail.com";
            navigator.clipboard.writeText(email).then(() => {
                alert("Email copied to clipboard!");
            });
        }
    </script>
</body>
</html>
