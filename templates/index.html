<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 40px;
            text-align: center;
        }
        h1 {
            color: #ffffff;
        }
        nav ul, ul {
            list-style-type: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        nav li a, ul li a {
            display: inline-block;
            background-color: #1e1e1e;
            color: #bb86fc;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        nav li a:hover, ul li a:hover {
            background-color: #bb86fc;
            color: #121212;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(187, 134, 252, 0.3);
        }
    </style>
</head>
<body>
    <h1>Welcome to Our Website</h1>

    <nav>
        <ul>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/works">Works</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <h1>Welcome to my programming works</h1>

    <ul>
        <li><a href="/works/touppercase">toUpperCase</a></li>
        <li><a href="/works/area/circle">Area of a Circle</a></li>
        <li><a href="/works/area/triangle">Area of a Triangle</a></li>
        <li><a href="/works/LinkedList">Linked List</a></li>
    </ul>
</body>
</html>
