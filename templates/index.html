<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <!-- Include Font Awesome 4.7 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
            padding: 40px;
        }
        /* Top Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 60px auto;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
        }
        .logo span {
            color: #bb86fc;
        }
        nav ul {
            list-style-type: none;
            display: flex;
            gap: 25px;
        }
        nav li a {
            color: #e0e0e0;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        nav li a:hover {
            color: #bb86fc;
        }
        .talk-btn {
            background-color: #bb86fc;
            color: #121212;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .talk-btn:hover {
            background-color: #a368fc;
            transform: translateY(-2px);
        }

        /* Hero Section Grid */
        .hero-container {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            max-width: 1100px;
            margin: 0 auto;
            align-items: center;
            gap: 40px;
        }
        .hero-content h1 {
            font-size: 42px;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        .hero-content h1 span {
            color: #bb86fc;
        }
        .hero-content h2 {
            font-size: 24px;
            color: #b0b0b0;
            margin-bottom: 20px;
        }
        .hero-content p {
            color: #999;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 480px;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }
        .btn-outline {
            background-color: transparent;
            color: #bb86fc;
            border: 2px solid #bb86fc;
            padding: 10px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-outline:hover {
            background-color: #bb86fc;
            color: #121212;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(187, 134, 252, 0.3);
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            gap: 15px;
        }
        .social-icon {
            width: 40px;
            height: 40px;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bb86fc;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        .social-icon:hover {
            background-color: #bb86fc;
            color: #121212;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(187, 134, 252, 0.3);
        }

        /* Hero Image Container */
        .hero-image-container {
            display: flex;
            justify-content: center;
        }
        .image-placeholder {
            width: 320px;
            height: 380px;
            background-color: #1e1e1e;
            border: 2px dashed #444;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            text-align: center;
            padding: 20px;
        }
        .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <a href="/" class="logo">Tristan<span>.</span></a>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/profile">About</a></li>
                <li><a href="/works">Portfolio</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
        <a href="/contact" class="talk-btn">Let's Talk</a>
    </header>

    <!-- Main Hero Section -->
    <main class="hero-container">
        <div class="hero-content">
            <h1>Hi, I'm <span>Tristan</span></h1>
            <h2>Computer Engineering Student</h2>
            <p>Building interactive web tools, data structure managers, and backend applications with Python Flask and clean UI designs.</p>
            
            <div class="button-group">
                <a href="/works" class="btn-outline">See Projects</a>
            </div>

            <!-- Social Links (Instagram, GitHub, Facebook) -->
            <div class="social-icons">
                <a href="https://www.instagram.com/iitzx3n0/" target="_blank" class="social-icon" title="Instagram">
                    <i class="fa fa-instagram"></i>
                </a>
                <a href="https://github.com/iiTzXeno" target="_blank" class="social-icon" title="GitHub">
                    <i class="fa fa-github"></i>
                </a>
                <a href="https://www.facebook.com/kyle.gaboy/" target="_blank" class="social-icon" title="Facebook">
                    <i class="fa fa-facebook"></i>
                </a>
                </a>
                <a href="https://www.youtube.com/@iiTzXeno" target="_blank" class="social-icon" title="YouTube">
                    <i class="fa fa-youtube"></i>
                </a>
                <a href="mailto:gaboytristan18@gmail.com" target="_blank" class="social-icon" title="Gmail">
                    <i class="fa fa-envelope"></i>
                </a>
            </div>
        </div>

        <!-- Self Picture Frame -->
        <div class="hero-image-container">
            <div class="image-placeholder">
                <img src="{{ url_for('static', filename='profile.jpg') }}" alt="Profile Picture" onerror="this.style.display='none'; this.parentElement.innerText='Drop your image here';">
            </div>
        </div>
    </main>

</body>
</html>
